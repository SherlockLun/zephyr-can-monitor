# --- Kernel ---
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1024

# --- CAN driver ---
CONFIG_CAN=y

# --- UART console ---
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# --- Random number generator ---
CONFIG_ENTROPY_GENERATOR=y

# --- Application options ---
CONFIG_CAN_LOGGER_BITRATE=500000

CONFIG_CAN_TX1_PERIOD_MS=100
CONFIG_CAN_TX2_PERIOD_MS=500
CONFIG_CAN_TX3_PERIOD_MS=1000

CONFIG_CAN_TX1_ID=0x101
CONFIG_CAN_TX2_ID=0x102
CONFIG_CAN_TX3_ID=0x103

# Optional RX control IDs — disabled by default (Kconfig defaults: n).
# Enable via boards/<board>.conf or: west build -- -DCONFIG_CAN_ID_START_ENABLED=y ...
