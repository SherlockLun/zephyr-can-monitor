# ---- Test: can_tx periodic transmit ----
CONFIG_ZTEST=y
CONFIG_ZTEST_ASSERT_VERBOSE=1

CONFIG_CAN=y

CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_PRINTK=y
CONFIG_UART_CONSOLE=y

# Short TX periods so tests finish quickly
CONFIG_CAN_TX1_PERIOD_MS=50
CONFIG_CAN_TX2_PERIOD_MS=50
CONFIG_CAN_TX3_PERIOD_MS=50
