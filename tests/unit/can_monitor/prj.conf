# ---- Test: can_monitor (default config — no optional IDs) ----
CONFIG_ZTEST=y
CONFIG_ZTEST_ASSERT_VERBOSE=1

# CAN subsystem with fake driver (no real hardware needed)
CONFIG_CAN=y

# Random generator for native_sim
CONFIG_TEST_RANDOM_GENERATOR=y

# Console
CONFIG_PRINTK=y
CONFIG_UART_CONSOLE=y

# No optional RX IDs → logger starts in LOGGING_ACTIVE
# CONFIG_CAN_ID_START_ENABLED is not set
# CONFIG_CAN_ID_STOP_ENABLED  is not set
# CONFIG_CAN_ID_HELLO_ENABLED is not set
