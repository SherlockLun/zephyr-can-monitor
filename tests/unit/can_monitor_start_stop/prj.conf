# ---- Test: can_monitor with START + STOP + HELLO IDs enabled ----
CONFIG_ZTEST=y
CONFIG_ZTEST_ASSERT_VERBOSE=1

CONFIG_CAN=y

CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_PRINTK=y
CONFIG_UART_CONSOLE=y

# All optional IDs enabled
CONFIG_CAN_ID_START_ENABLED=y
CONFIG_CAN_ID_START=0x200

CONFIG_CAN_ID_STOP_ENABLED=y
CONFIG_CAN_ID_STOP=0x201

CONFIG_CAN_ID_HELLO_ENABLED=y
CONFIG_CAN_ID_HELLO=0x202
